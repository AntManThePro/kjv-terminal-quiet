<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KJV Reader — quiet</title>
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="description" content="KJV Reader — quiet. A simple King James Bible reader. Matthew 1 and Genesis 1 work offline; other chapters load from bible-api.com and stay saved on your phone. Your place is saved locally, no account." />
  <link rel="icon" href="icons/favicon.ico" sizes="48x48 32x32 16x16">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/favicon-512.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --g: #7dffb4; --c: #8be9ff; --p: #ff6ea8; --y: #ffd36a;
      --bg: #0b0c10; --ink: #e8f6ee; --dim: #8aa396; --line: #2a4e3c;
      --fs: 19px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body { font-family: "Source Serif 4", Georgia, serif; font-size: var(--fs); display: flex; flex-direction: column; overflow: hidden; }
    button, input { font-family: "Share Tech Mono", ui-monospace, monospace; }
    button { cursor: pointer; }
    .top { flex-shrink: 0; padding: .55rem .75rem .4rem; border-bottom: 1px solid #4a7d64; background: #101218; box-shadow: 0 1px 0 #7dffb422; }
    .brand { display: flex; align-items: baseline; gap: .6rem; }
    .brand b { letter-spacing: .16em; color: var(--g); font-size: .95rem; }
    .brand span { color: var(--dim); font-size: .8rem; }
    .where {
      margin-top: .45rem;
      width: 100%;
      min-height: 52px;
      border-radius: 10px;
      border: 1px solid #5aa87a;
      background: #15241c;
      color: var(--g);
      font-family: "Share Tech Mono", monospace;
      font-size: 1.02rem;
      letter-spacing: .04em;
      text-align: left;
      padding: .45rem .7rem;
      line-height: 1.3;
      box-shadow: inset 0 0 0 1px #7dffb444, 0 0 16px #7dffb428;
    }
    .where small { display: block; color: var(--c); font-size: .72rem; letter-spacing: .08em; margin-top: .12rem; }
    .jump { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; margin-top: .45rem; }
    .jump button {
      min-height: 42px; border-radius: 9px; border: 1px solid #4a7d8a; background: #121c22;
      color: var(--c); font-size: .78rem; text-align: left; padding: .35rem .55rem; line-height: 1.25;
      box-shadow: inset 0 0 0 1px #8be9ff2e, 0 0 12px #8be9ff1c;
    }
    .jump button small { display: block; color: var(--dim); font-size: .68rem; }
    .jump button.here {
      border-color: #5aa87a; background: #132018; color: var(--g);
      box-shadow: inset 0 0 0 1px #7dffb444, 0 0 14px #7dffb428;
    }
    .nav { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; padding: .55rem .75rem .4rem; flex-shrink: 0; }
    .btn {
      min-height: 48px; border-radius: 10px; border: 1px solid #4a8a64;
      background: #132018; color: var(--g); font-size: .92rem;
      box-shadow: inset 0 0 0 1px #7dffb430, 0 0 12px #7dffb41c;
    }
    .btn:active { background: #1b3324; }
    .btn.wide {
      grid-column: 1 / -1; color: var(--c); border-color: #4a7d8a; background: #121c22;
      box-shadow: inset 0 0 0 1px #8be9ff36, 0 0 12px #8be9ff1c;
    }
    .btn.listen {
      color: var(--y); border-color: #a07c28; background: #1d180c;
      box-shadow: inset 0 0 0 1px #ffd36a50, 0 0 16px #ffd36a30;
    }
    .btn.more {
      color: var(--p); border-color: #8a4060; background: #1d1018;
      box-shadow: inset 0 0 0 1px #ff6ea850, 0 0 16px #ff6ea830;
    }
    .btn.ghost { color: var(--dim); border-color: #3a4650; background: #12161c; }
    .reader { flex: 1; min-height: 0; overflow: auto; padding: .7rem 1rem 1.4rem; -webkit-overflow-scrolling: touch; }
    .reader.sit { display: flex; flex-direction: column; justify-content: center; }
    .reader.sit .ch, .reader.sit .verse:not(.on) { display: none; }
    .reader.sit .verse.on { font-size: 1.22em; line-height: 1.6; padding: 1rem .6rem; }
    .ch { font-family: "Share Tech Mono", monospace; color: var(--c); letter-spacing: .12em; font-size: .85rem; margin: 0 0 .8rem; }
    .verse { margin: 0 0 .85rem; line-height: 1.55; }
    .verse.on { background: #16301f; outline: 1px solid #4a8a64; border-radius: 8px; padding: .25rem .4rem; box-shadow: 0 0 14px #7dffb422; }
    .vnum { color: var(--y); font-family: "Share Tech Mono", monospace; font-size: .8rem; margin-right: .45rem; }
    .fail { border: 1px solid #4a8a64; border-radius: 12px; padding: .9rem 1rem; color: var(--dim); box-shadow: 0 0 12px #7dffb414; }
    .hint { flex-shrink: 0; padding: .35rem .75rem; font-size: .78rem; color: var(--dim); border-top: 1px solid #4a7d64; box-shadow: 0 -1px 0 #7dffb422; }
    .look { flex-shrink: 0; display: flex; gap: .4rem; padding: .5rem .75rem calc(.55rem + env(safe-area-inset-bottom)); background: #0e1016; border-top: 1px solid #4a7d64; box-shadow: 0 -1px 0 #7dffb422; }
    .look input { flex: 1; min-width: 0; min-height: 48px; border-radius: 10px; border: 1px solid #4a8a64; background: #0a0c10; color: var(--ink); padding: 0 .75rem; font-size: 1rem; box-shadow: inset 0 0 0 1px #7dffb428, 0 0 10px #7dffb414; }
    .look button { min-width: 72px; }
    .sheet-bg { display: none; position: fixed; inset: 0; background: #0009; z-index: 40; align-items: flex-end; justify-content: center; }
    .sheet-bg.show { display: flex; }
    .sheet { width: min(640px, 100%); max-height: 78dvh; overflow: auto; background: #141820; border: 1px solid #4a7d64; border-radius: 16px 16px 0 0; padding: 1rem 1rem 1.4rem; box-shadow: 0 -8px 30px #7dffb414; }
    .sheet h2 { margin: 0 0 .6rem; font-family: "Share Tech Mono", monospace; color: var(--g); font-size: 1rem; }
    .book { display: block; width: 100%; text-align: left; min-height: 44px; margin: 0 0 .25rem; background: transparent; border: 0; color: var(--c); font-size: 1.05rem; border-bottom: 1px solid #243840; }
    .note { min-height: 140px; max-height: 32dvh; overflow: auto; background: #0a0c10; border: 1px solid #4a7d64; border-radius: 8px; padding: .6rem; font-size: .92rem; color: var(--dim); white-space: pre-wrap; }
    .row { display: flex; gap: .4rem; margin-top: .6rem; flex-wrap: wrap; }
    .ch-head { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem; margin: 0 0 .35rem; }
    .ch-head h2 { margin: 0; }
    .ch-head .count { color: var(--dim); font-size: .78rem; letter-spacing: .08em; }
    .ch-now {
      margin: 0 0 .85rem; padding: .55rem .7rem; border-radius: 10px;
      border: 1px solid #5aa87a; background: #15241c; color: var(--g);
      box-shadow: inset 0 0 0 1px #7dffb444, 0 0 14px #7dffb422;
    }
    .ch-now b { display: block; font-size: 1.15rem; }
    .ch-now span { color: var(--c); font-size: .75rem; letter-spacing: .06em; }
    .ch-group { margin: 0 0 .85rem; }
    .ch-group h3 {
      margin: 0 0 .4rem; font-size: .72rem; letter-spacing: .14em;
      color: var(--c); text-transform: uppercase; font-weight: 400;
    }
    .ch-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4rem; }
    .ch-grid button {
      min-height: 46px; border-radius: 8px; border: 1px solid #3a5a48;
      background: #101820; color: #9ecfb4; font-size: .95rem;
    }
    .ch-grid button.near { border-color: #4a8a64; color: var(--g); background: #132018; }
    .ch-grid button.on {
      min-height: 52px; background: #1e3d28; border-color: var(--g); color: #e8f6ee;
      font-size: 1.15rem; box-shadow: inset 0 0 0 1px #7dffb455, 0 0 16px #7dffb430;
    }
    @media (min-width: 720px) {
      .nav { grid-template-columns: repeat(4, minmax(140px, 200px)); }
      .btn.wide { grid-column: auto; }
      .top, .nav, .reader, .hint, .look { max-width: 820px; width: 100%; margin-left: auto; margin-right: auto; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .brand span, .hint { display: none; }
      .nav { grid-template-columns: repeat(4, 1fr); padding: .35rem .6rem; }
      .btn { min-height: 40px; font-size: .8rem; }
      .btn.wide { grid-column: auto; }
      .look input, .look button { min-height: 40px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><b>KJV</b><span>King James Bible — simple reader</span></div>
    <div class="jump">
      <button type="button" id="toOT"><small>Old Testament</small>Genesis</button>
      <button type="button" id="toNT" class="here"><small>New Testament · you are here</small>Matthew</button>
    </div>
    <button class="where" id="where" type="button">Matthew · chapter 1<small>Tap to pick a chapter</small></button>
  </header>
  <div class="nav">
    <button class="btn" id="prev" type="button">← Previous</button>
    <button class="btn" id="next" type="button">Next →</button>
    <button class="btn wide" id="books" type="button">Choose a book</button>
    <button class="btn listen" id="listen" type="button">Read aloud</button>
    <button class="btn more" id="more" type="button">More</button>
  </div>
  <main class="reader" id="reader"></main>
  <div class="hint" id="hint">You start in Matthew. Tap a verse twice to sit with just that verse.</div>
  <form class="look" id="form">
    <input id="q" autocomplete="off" autocapitalize="off" placeholder="Matthew 1" />
    <button class="btn" type="submit">Go</button>
  </form>
  <div class="sheet-bg" id="overlay"><div class="sheet" id="sheet"></div></div>
<script>
const SEED = {"Matthew:1": ["The book of the generation of Jesus Christ, the son of David, the son of Abraham.", "Abraham begat Isaac; and Isaac begat Jacob; and Jacob begat Judas and his brethren;", "And Judas begat Phares and Zara of Thamar; and Phares begat Esrom; and Esrom begat Aram;", "And Aram begat Aminadab; and Aminadab begat Naasson; and Naasson begat Salmon;", "And Salmon begat Booz of Rachab; and Booz begat Obed of Ruth; and Obed begat Jesse;", "And Jesse begat David the king; and David the king begat Solomon of her that had been the wife of Urias;", "And Solomon begat Roboam; and Roboam begat Abia; and Abia begat Asa;", "And Asa begat Josaphat; and Josaphat begat Joram; and Joram begat Ozias;", "And Ozias begat Joatham; and Joatham begat Achaz; and Achaz begat Ezekias;", "And Ezekias begat Manasses; and Manasses begat Amon; and Amon begat Josias;", "And Josias begat Jechonias and his brethren, about the time they were carried away to Babylon:", "And after they were brought to Babylon, Jechonias begat Salathiel; and Salathiel begat Zorobabel;", "And Zorobabel begat Abiud; and Abiud begat Eliakim; and Eliakim begat Azor;", "And Azor begat Sadoc; and Sadoc begat Achim; and Achim begat Eliud;", "And Eliud begat Eleazar; and Eleazar begat Matthan; and Matthan begat Jacob;", "And Jacob begat Joseph the husband of Mary, of whom was born Jesus, who is called Christ.", "So all the generations from Abraham to David are fourteen generations; and from David until the carrying away into Babylon are  fourteen generations; and from the carrying away into Babylon unto Christ are fourteen generations.", "Now the birth of Jesus Christ was on this wise: When as his mother Mary was espoused to Joseph, before they came together, she was found with child of the Holy Ghost.", "Then Joseph her husband, being a just man, and not willing to make her a publick example, was minded to put her away privily.", "But while he thought on these things, behold, the angel of the Lord appeared unto him in a dream, saying, Joseph, thou son of David, fear not to take unto thee Mary thy wife: for that which is conceived in her is of the Holy Ghost.", "And she shall bring forth a son, and thou shalt call his name JESUS: for he shall save his people from their sins.", "Now all this was done, that it might be fulfilled which was spoken of the Lord by the prophet, saying,", "Behold, a virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us.", "Then Joseph being raised from sleep did as the angel of the Lord had bidden him, and took unto him his wife:", "And knew her not till she had brought forth her firstborn son: and he called his name JESUS."], "Genesis:1": ["In the beginning God created the heaven and the earth.", "And the earth was without form, and void; and darkness was  upon the face of the deep. And the Spirit of God moved upon the face of the waters.", "And God said, Let there be light: and there was light.", "And God saw the light, that it was good: and God divided the light from the darkness.", "And God called the light Day, and the darkness he called Night. And the evening and the morning were the first day.", "And God said, Let there be a firmament in the midst of the waters, and let it divide the waters from the waters.", "And God made the firmament, and divided the waters which were  under the firmament from the waters which were above the firmament: and it was so.", "And God called the firmament Heaven. And the evening and the morning were the second day.", "And God said, Let the waters under the heaven be gathered together unto one place, and let the dry land appear: and it was so.", "And God called the dry land Earth; and the gathering together of the waters called he Seas: and God saw that it was good.", "And God said, Let the earth bring forth grass, the herb yielding seed, and the fruit tree yielding fruit after his kind, whose seed is in itself, upon the earth: and it was so.", "And the earth brought forth grass, and herb yielding seed after his kind, and the tree yielding fruit, whose seed was in itself, after his kind: and God saw that it was good.", "And the evening and the morning were the third day.", "And God said, Let there be lights in the firmament of the heaven to divide the day from the night; and let them be for signs, and for seasons, and for days, and years:", "And let them be for lights in the firmament of the heaven to give light upon the earth: and it was so.", "And God made two great lights; the greater light to rule the day, and the lesser light to rule the night: he made the stars also.", "And God set them in the firmament of the heaven to give light upon the earth,", "And to rule over the day and over the night, and to divide the light from the darkness: and God saw that it was good.", "And the evening and the morning were the fourth day.", "And God said, Let the waters bring forth abundantly the moving creature that hath life, and fowl that may fly above the earth in the open firmament of heaven.", "And God created great whales, and every living creature that moveth, which the waters brought forth abundantly, after their kind, and every winged fowl after his kind: and God saw that it was good.", "And God blessed them, saying, Be fruitful, and multiply, and fill the waters in the seas, and let fowl multiply in the earth.", "And the evening and the morning were the fifth day.", "And God said, Let the earth bring forth the living creature after his kind, cattle, and creeping thing, and beast of the earth after his kind: and it was so.", "And God made the beast of the earth after his kind, and cattle after their kind, and every thing that creepeth upon the earth after his kind: and God saw that it was good.", "And God said, Let us make man in our image, after our likeness: and let them have dominion over the fish of the sea, and over the fowl of the air, and over the cattle, and over all the earth, and over every creeping thing that creepeth upon the earth.", "So God created man in his own image, in the image of God created he him; male and female created he them.", "And God blessed them, and God said unto them, Be fruitful, and multiply, and replenish the earth, and subdue it: and have dominion over the fish of the sea, and over the fowl of the air, and over every living thing that moveth upon the earth.", "And God said, Behold, I have given you every herb bearing seed, which is upon the face of all the earth, and every tree, in the which is the fruit of a tree yielding seed; to you it shall be for meat.", "And to every beast of the earth, and to every fowl of the air, and to every thing that creepeth upon the earth, wherein there is life, I have given every green herb for meat: and it was so.", "And God saw every thing that he had made, and, behold, it was  very good. And the evening and the morning were the sixth day."]};

  const BOOKS = ["Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther","Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi","Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"];
  const CHS = [50,40,27,36,34,24,21,4,31,24,22,25,29,36,10,13,10,42,150,31,12,8,66,52,5,48,12,14,3,9,1,4,7,3,3,3,2,14,4,28,16,24,21,28,16,16,13,6,6,4,4,5,3,6,4,3,1,13,5,5,3,5,1,1,1,22];
  const ALIAS = {};
  BOOKS.forEach((n, i) => { ALIAS[n.toLowerCase()] = i; ALIAS[n.toLowerCase().replace(/\s+/g,"")] = i; });
  Object.assign(ALIAS, {gen:0,exo:1,lev:2,num:3,deut:4,josh:5,judg:6,ru:7,"1sam":8,"2sam":9,"1kgs":10,"2kgs":11,"1chr":12,"2chr":13,ezr:14,neh:15,est:16,ps:18,psalm:18,psalms:18,prov:19,ecc:20,song:21,isa:22,jer:23,lam:24,eze:25,dan:26,hos:27,joel:28,am:29,oba:30,jon:31,mic:32,nah:33,hab:34,zep:35,hag:36,zec:37,mal:38,matt:39,mt:39,mk:40,lk:41,jn:42,john:42,act:43,rom:44,"1cor":45,"2cor":46,gal:47,eph:48,phil:49,col:50,"1th":51,"2th":52,"1tim":53,"2tim":54,tit:55,phm:56,heb:57,jas:58,"1pet":59,"2pet":60,"1jn":61,"2jn":62,"3jn":63,jude:64,rev:65});
  const mem = {};
  const log = [];
  let cur;
  try { cur = JSON.parse(localStorage.getItem("kjv.quiet.place") || ""); } catch (e) { cur = null; }
  if (!cur || !cur.book) cur = { book: "Matthew", ch: 1, vs: 1 };
  let speaking = false, sitting = false, typeSize = +(localStorage.getItem("kjv.quiet.fs") || 19);
  const $ = (id) => document.getElementById(id);
  function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
  function remember(msg){ log.push(msg); if (log.length > 40) log.shift(); }
  function savePlace(){ localStorage.setItem("kjv.quiet.place", JSON.stringify(cur)); }
  function applyType(){ document.documentElement.style.setProperty("--fs", typeSize + "px"); localStorage.setItem("kjv.quiet.fs", String(typeSize)); }
  function chapterCount(book){ const i = BOOKS.indexOf(book); return i >= 0 ? CHS[i] : 1; }
  function keyOf(book, ch){ return book + ":" + ch; }
  function storeGet(k){ try { const raw = localStorage.getItem("kjv.ch." + k); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
  function storeSet(k, arr){ try { localStorage.setItem("kjv.ch." + k, JSON.stringify(arr)); } catch (e) {} }
  function bookName(t){
    t = String(t || "").toLowerCase().replace(/\./g,"").trim();
    if (ALIAS[t] != null) return BOOKS[ALIAS[t]];
    if (ALIAS[t.replace(/\s+/g,"")] != null) return BOOKS[ALIAS[t.replace(/\s+/g,"")]];
    const hits = BOOKS.filter(n => n.toLowerCase().startsWith(t));
    return hits.length === 1 ? hits[0] : null;
  }
  function parseRef(raw){
    const s = String(raw || "").trim().replace(/\s+/g, " ");
    const m = s.match(/^((?:[1-3]\s*)?[a-zA-Z][a-zA-Z\s]*?[a-zA-Z])\s+(\d+)(?:\s*:\s*(\d+))?$/);
    if (!m) return null;
    const name = bookName(m[1]);
    if (!name) return null;
    return { book: name, ch: +m[2], vs: m[3] ? +m[3] : 1 };
  }
  async function load(book, ch){
    const k = keyOf(book, ch);
    if (mem[k] && mem[k].length) return mem[k];
    const stored = storeGet(k);
    if (stored && stored.length) { mem[k] = stored; return stored; }
    if (SEED[k] && SEED[k].length) { mem[k] = SEED[k]; return SEED[k]; }
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 8000);
    try {
      const r = await fetch("https://bible-api.com/" + encodeURIComponent(book + " " + ch) + "?translation=kjv", { signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok) throw new Error("Could not open that chapter.");
      const j = await r.json();
      if (!j.verses || !j.verses.length) throw new Error("That chapter is not in this book.");
      const arr = [];
      j.verses.forEach(v => { arr[v.verse - 1] = String(v.text || "").replace(/\s+/g, " ").trim(); });
      mem[k] = arr; storeSet(k, arr); return arr;
    } catch (e) {
      clearTimeout(t);
      throw new Error("Need a connection for " + book + " " + ch + ". Matthew 1 and Genesis 1 are already in this page.");
    }
  }
  function markHere(){
    const nt = BOOKS.indexOf(cur.book) >= 39;
    $("toOT").classList.toggle("here", !nt);
    $("toNT").classList.toggle("here", nt);
    $("toOT").innerHTML = !nt ? "<small>Old Testament · you are here</small>Genesis" : "<small>Old Testament</small>Go to Genesis";
    $("toNT").innerHTML = nt ? "<small>New Testament · you are here</small>Matthew" : "<small>New Testament</small>Go to Matthew";
  }
  function paint(verses){
    sitting = false;
    $("reader").classList.remove("sit");
    $("where").innerHTML = cur.book + "  ·  chapter " + cur.ch + " of " + chapterCount(cur.book) + "<small>Tap to pick a chapter</small>";
    $("hint").textContent = "Tap a verse twice to sit with just that verse. Tap Genesis or Matthew to change Testaments.";
    markHere(); savePlace();
    const bits = ["<div class='ch'>" + esc(cur.book.toUpperCase()) + "  " + cur.ch + "</div>"];
    verses.forEach((t, i) => {
      if (!t) return;
      const n = i + 1;
      bits.push("<div class='verse" + (n === cur.vs ? " on" : "") + "' data-v='" + n + "'><span class='vnum'>" + n + "</span>" + esc(t) + "</div>");
    });
    $("reader").innerHTML = bits.join("");
    const on = $("reader").querySelector(".verse.on");
    if (on) on.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  function paintFail(msg){
    $("where").textContent = msg;
    $("reader").classList.remove("sit");
    $("reader").innerHTML = "<div class='fail'><p>" + esc(msg) + "</p><div class='row'><button class='btn' type='button' data-ref='Matthew 1'>Open Matthew 1</button><button class='btn' type='button' data-ref='Genesis 1'>Open Genesis 1</button><button class='btn ghost' type='button' id='retry'>Try this chapter again</button></div></div>";
    const r = $("retry");
    if (r) r.onclick = () => openRef({ book: cur.book, ch: cur.ch, vs: cur.vs || 1 });
  }
  async function openRef(raw){
    const ref = typeof raw === "string" ? parseRef(raw) : raw;
    if (!ref) { remember("Did not understand that. Try Matthew 1"); $("where").textContent = "Did not understand that. Try Matthew 1"; return false; }
    cur = { book: ref.book, ch: ref.ch, vs: ref.vs || 1 };
    try {
      const verses = await load(ref.book, ref.ch);
      if (cur.vs > verses.length) cur.vs = 1;
      paint(verses); remember("Opened " + ref.book + " " + ref.ch); return true;
    } catch (e) { remember(e.message); paintFail(e.message); return false; }
  }
  async function step(dir){
    const nextCh = cur.ch + dir;
    if (nextCh >= 1 && nextCh <= chapterCount(cur.book)) return openRef({ book: cur.book, ch: nextCh, vs: 1 });
    const i = BOOKS.indexOf(cur.book) + dir;
    if (i < 0 || i >= BOOKS.length) { $("where").textContent = dir > 0 ? "That is the last book." : "That is the first book."; return; }
    const book = BOOKS[i];
    await openRef({ book: book, ch: dir > 0 ? 1 : chapterCount(book), vs: 1 });
  }
  function show(html){ $("sheet").innerHTML = html; $("overlay").classList.add("show"); }
  function hide(){ $("overlay").classList.remove("show"); }
  function showChapters(){
    const n = chapterCount(cur.book);
    const size = n > 60 ? 20 : 10;
    let groups = "";
    for (let start = 1; start <= n; start += size) {
      const end = Math.min(n, start + size - 1);
      let buttons = "";
      for (let c = start; c <= end; c++) {
        const cls = c === cur.ch ? "on" : (Math.abs(c - cur.ch) <= 1 ? "near" : "");
        buttons += "<button type='button' class='"+cls+"' data-ref='"+cur.book+" "+c+"'>"+c+"</button>";
      }
      groups += "<div class='ch-group'><h3>Chapters "+start+"–"+end+"</h3><div class='ch-grid'>"+buttons+"</div></div>";
    }
    show(
      "<div class='ch-head'><h2>"+esc(cur.book)+"</h2><div class='count'>"+n+" chapters</div></div>" +
      "<div class='ch-now'><b>Chapter "+cur.ch+"</b><span>You are here · tap another number to move</span></div>" +
      groups
    );
  }
  function showBooks(){
    const ot = BOOKS.slice(0,39).map(n => "<button class='book' data-ref='"+n+" 1'>"+n+"</button>").join("");
    const nt = BOOKS.slice(39).map(n => "<button class='book' data-ref='"+n+" 1'>"+n+"</button>").join("");
    show("<h2>Choose a book</h2><div class='row' style='margin:0 0 .8rem'><button class='btn' data-ref='Genesis 1' type='button'>Genesis</button><button class='btn' data-ref='Matthew 1' type='button'>Matthew</button></div><p style='color:#8aa396'>Old Testament begins at Genesis. New Testament begins at Matthew.</p>"+ot+"<hr style='border-color:#3d6b55'>"+nt);
  }
  function showMore(){
    show("<h2>A little more</h2><p>This is a page, not a streak. No account. No ads. One chapter at a time.</p><p>Tap a verse twice to sit with only that verse. Tap it again to bring the chapter back.</p><p>Matthew 1 and Genesis 1 live inside this file, so they open even with no signal. Other chapters stay on the phone after you open them once with internet.</p><div class='row'><button class='btn' id='smaller' type='button'>Smaller words</button><button class='btn' id='bigger' type='button'>Bigger words</button></div><h2 style='margin-top:1rem'>Notebook</h2><div class='note' id='note'>"+(log.length ? log.map(esc).join("\n") : "Nothing written yet.")+"</div><div class='row'><button class='btn' id='clear' type='button'>Clear notebook</button><button class='btn ghost' id='closeMore' type='button'>Close</button></div>");
    $("clear").onclick = () => { log.length = 0; $("note").textContent = "Cleared. The notebook is empty."; };
    $("closeMore").onclick = hide;
    $("smaller").onclick = () => { typeSize = Math.max(16, typeSize-2); applyType(); };
    $("bigger").onclick = () => { typeSize = Math.min(28, typeSize+2); applyType(); };
  }
  function speak(){
    if (!("speechSynthesis" in window)) { $("where").textContent = "This phone cannot read aloud."; return; }
    if (speaking) { speechSynthesis.cancel(); speaking = false; $("listen").textContent = "Read aloud"; return; }
    const verses = mem[keyOf(cur.book, cur.ch)] || [];
    const text = sitting ? (verses[cur.vs-1] || "") : verses.filter(Boolean).join(". ");
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.9; speaking = true; $("listen").textContent = "Stop reading";
    u.onend = () => { speaking = false; $("listen").textContent = "Read aloud"; };
    speechSynthesis.speak(u);
  }
  function sitToggle(n){
    if (sitting && cur.vs === n) {
      sitting = false; $("reader").classList.remove("sit");
      $("hint").textContent = "Whole chapter is back. Tap a verse twice to sit with it again.";
      return;
    }
    cur.vs = n; sitting = true; savePlace();
    [...$("reader").querySelectorAll(".verse")].forEach(el => el.classList.toggle("on", +el.getAttribute("data-v") === n));
    $("reader").classList.add("sit");
    $("hint").textContent = "Sitting with " + cur.book + " " + cur.ch + ":" + n + ". Tap the verse again for the whole chapter.";
  }
  $("prev").onclick = () => step(-1);
  $("next").onclick = () => step(1);
  $("toOT").onclick = () => openRef({book:"Genesis", ch:1, vs:1});
  $("toNT").onclick = () => openRef({book:"Matthew", ch:1, vs:1});
  $("where").onclick = showChapters;
  $("books").onclick = showBooks;
  $("listen").onclick = speak;
  $("more").onclick = showMore;
  $("form").onsubmit = (e) => { e.preventDefault(); openRef($("q").value); $("q").value = ""; };
  $("overlay").onclick = (e) => {
    if (e.target === $("overlay")) hide();
    const ref = e.target.closest("[data-ref]");
    if (ref) { hide(); openRef(ref.getAttribute("data-ref")); }
  };
  $("reader").onclick = (e) => {
    const go = e.target.closest("[data-ref]");
    if (go) { openRef(go.getAttribute("data-ref")); return; }
    const v = e.target.closest(".verse");
    if (!v) return;
    const n = +v.getAttribute("data-v");
    if (cur.vs === n) sitToggle(n);
    else {
      cur.vs = n; savePlace(); sitting = false; $("reader").classList.remove("sit");
      [...$("reader").querySelectorAll(".verse")].forEach(el => el.classList.toggle("on", el === v));
    }
  };
  let x0 = 0;
  $("reader").addEventListener("touchstart", e => { x0 = e.changedTouches[0].clientX; }, {passive:true});
  $("reader").addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - x0;
    if (sitting) return;
    if (dx > 70) step(-1);
    if (dx < -70) step(1);
  }, {passive:true});
  applyType();
  openRef({ book: cur.book, ch: cur.ch, vs: cur.vs || 1 });

</script>
</body>
</html>
